<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civilizer</title>
<link rel="stylesheet" href="/style.css">
<script>try { const t = localStorage.getItem("civilizer-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <div class="bar">
    <span class="brand">Civilizer</span>
    <span class="gameline" id="gameline">Loading…</span>
    <span class="pill" id="refresh" title="Last store refresh"></span>
    <span class="pill" id="monitor" title="Turn monitor"><span class="dot"></span>monitor</span>
    <button class="iconbtn" id="theme" title="Theme: system / light / dark">◐</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#story" data-tab="story">Story</a>
    <a href="#timeline" data-tab="timeline">Timeline</a>
    <a href="#charts" data-tab="charts">Charts</a>
    <a href="#turn" data-tab="turn">Turn by turn</a>
    <a href="#advisor" data-tab="advisor">Advisor</a>
  </nav>
</header>
<main id="view"></main>
<div id="tip" role="tooltip"></div>
<script src="/app.js"></script>
</body>
</html>
